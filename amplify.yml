version: 1
frontend:
  phases:
    preBuild:
      commands:
        - env | grep -E '^NEXT_PUBLIC_' > .env.production || true
        - npm ci
    build:
      commands:
        - npm run typecheck
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
